x-logging:
  logging: &default-logging
    driver: "local"
    options:
      max-size: "10m"
      max-file: "3"

services:
  control:
    build:
      context: ${NEXUS_CONTROL_BUILD_CONTEXT:-../../nexus-control}
      dockerfile: Dockerfile
    image: ${CONTROL_IMAGE:-nexus-control}:${CONTROL_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AUTH_INIT_OWNER_USERNAME: ${AUTH_INIT_OWNER_USERNAME:-admin}
      AUTH_INIT_OWNER_DISPLAY_NAME: ${AUTH_INIT_OWNER_DISPLAY_NAME:-Admin}
      AUTH_INIT_OWNER_PASSWORD: ${AUTH_INIT_OWNER_PASSWORD:-}
      CONTROL_ADDRESS: 0.0.0.0:8020
      CONTROL_DATA_DIR: /var/lib/nexus-control
      CONTROL_DATABASE_DRIVER: ${CONTROL_DATABASE_DRIVER:-sqlite}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-/var/lib/nexus-control/data/control.db}
      CONTROL_DEPLOYMENT_NAME: ${CONTROL_DEPLOYMENT_NAME:-Nexus}
      CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN:?CONTROL_SERVICE_TOKEN must be set}
      CONTROL_SETUP_TOKEN: ${CONTROL_SETUP_TOKEN:-}
      CONTROL_SIGNING_KEY_FILE: /var/lib/nexus-control/control-signing.key
      CONTROL_SIGNING_PUBLIC_KEY_FILE: /var/lib/nexus-control-public/control-signing.pub
      CONTROL_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-nexus_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      CONTROL_PRINCIPAL_AUDIENCE: nexus-runtime
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/.nexus/control:/var/lib/nexus-control
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/.nexus/control-public:/var/lib/nexus-control-public
    expose:
      - "8020"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8020/api/control/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging

  nexus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime-base
      cache_from:
        - "type=local,src=../.buildx-cache/nexus"
      cache_to:
        - "type=local,dest=../.buildx-cache/nexus,mode=max"
      args:
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org/}
        PNPM_VERSION: ${PNPM_VERSION:-9.15.2}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        BUN_CONFIG_REGISTRY: ${BUN_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        NEXUS_DOCKER_BUNDLE_NXS_RUNTIME: ${NEXUS_DOCKER_BUNDLE_NXS_RUNTIME:-1}
        NEXUS_NXS_RUNTIME_RELEASE: ${NEXUS_NXS_RUNTIME_RELEASE:-nxs-stable}
    image: ${IMAGE:-nexus}:app-${TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOST: 0.0.0.0
      PORT: 8010
      PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org/}
      BUN_CONFIG_REGISTRY: ${BUN_CONFIG_REGISTRY:-https://registry.npmjs.org/}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
      UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      NEXUS_APT_ALLOWLIST: ${NEXUS_APT_ALLOWLIST:-ca-certificates curl ffmpeg git imagemagick iputils-ping jq less procps ripgrep rsync unzip vim wget zip}
      DATABASE_DRIVER: ${NEXUS_DOCKER_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${NEXUS_DOCKER_DATABASE_URL:-sqlite:////home/agent/.nexus/app/data/nexus.db}
      CACHE_FILE_DIR: ${NEXUS_DOCKER_CACHE_FILE_DIR:-/home/agent/.nexus/app/cache}
      LOG_PATH: ${NEXUS_DOCKER_LOG_PATH:-/home/agent/.nexus/app/logs/logger.log}
      WORKSPACE_PATH: ${NEXUS_DOCKER_WORKSPACE_PATH:-/home/agent/.nexus/users}
      NEXUS_APP_ROOT: /opt/app
      NEXUS_APP_MODE: ${NEXUS_DOCKER_APP_MODE:-}
      NEXUS_CONTROL_URL: http://control:8020
      NEXUS_CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN:?CONTROL_SERVICE_TOKEN must be set}
      NEXUS_CONTROL_PRINCIPAL_PUBLIC_KEY_FILE: /home/agent/.nexus/control-public/control-signing.pub
      NEXUS_CONTROL_PRINCIPAL_AUDIENCE: nexus-runtime
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-nexus_session}
      CONTROL_SERVICE_TOKEN: ""
      CONTROL_SETUP_TOKEN: ""
      CONTROL_SIGNING_PRIVATE_KEY: ""
      CONTROL_DATABASE_DRIVER: ""
      CONTROL_DATABASE_URL: ""
      NEXUS_STATE_ROOT: /home/agent/.nexus
      NEXUS_CONFIG_DIR: /home/agent/.nexus
      CLAUDE_CONFIG_DIR: /home/agent/.nexus
      NEXUSCTL_COMMAND_PATH: /usr/local/bin/nexusctl
      NEXUSCFG_COMMAND_PATH: /usr/local/bin/nexuscfg
      NEXUS_NXS_COMMAND_PATH: ${NEXUS_DOCKER_NXS_COMMAND_PATH:-/opt/app/bin/nxs}
      NEXUS_RUNTIME_ISOLATION_MODE: ${NEXUS_RUNTIME_ISOLATION_MODE:-enforce}
      NEXUS_RUNTIME_LAUNCHER_PATH: /usr/local/libexec/nexus-runtime-launcher
      NEXUS_NXS_RUNTIME_CACHE_DIR: ${NEXUS_DOCKER_NXS_RUNTIME_CACHE_DIR:-}
      NEXUS_DOCKER_REWRITE_LOOPBACK_PROXY: ${NEXUS_DOCKER_REWRITE_LOOPBACK_PROXY:-true}
      NEXUS_DESKTOP_SESSION_TOKEN: ""
      CONNECTOR_CREDENTIALS_KEY: ${CONNECTOR_CREDENTIALS_KEY:-}
      CONNECTOR_CREDENTIALS_KEY_FILE: ${CONNECTOR_CREDENTIALS_KEY_FILE:-/home/agent/.nexus/app/config/connector-credentials.key}
      HTTP_PROXY: ${NEXUS_DOCKER_HTTP_PROXY:-${HTTP_PROXY:-}}
      HTTPS_PROXY: ${NEXUS_DOCKER_HTTPS_PROXY:-${HTTPS_PROXY:-}}
      ALL_PROXY: ${NEXUS_DOCKER_ALL_PROXY:-${ALL_PROXY:-}}
      NO_PROXY: ${NEXUS_DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,control,nexus,nginx,host.docker.internal}
      http_proxy: ${NEXUS_DOCKER_http_proxy:-${http_proxy:-}}
      https_proxy: ${NEXUS_DOCKER_https_proxy:-${https_proxy:-}}
      all_proxy: ${NEXUS_DOCKER_all_proxy:-${all_proxy:-}}
      no_proxy: ${NEXUS_DOCKER_no_proxy:-localhost,127.0.0.1,::1,control,nexus,nginx,host.docker.internal}
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/.nexus:/home/agent/.nexus
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/.claude.json:/home/agent/.nexus/users/__system__/runtime/.claude.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8010"
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/nexus/v1/health >/dev/null || exit 1"]
      interval: 300s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    build:
      context: ..
      dockerfile: web/Dockerfile
      cache_from:
        - "type=local,src=../.buildx-cache/nginx"
      cache_to:
        - "type=local,dest=../.buildx-cache/nginx,mode=max"
      args:
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org/}
        PNPM_VERSION: ${PNPM_VERSION:-9.15.2}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_API_URL: ${VITE_API_URL:-}
    image: ${IMAGE:-nexus}:web-${TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-/etc/nginx/certs/fullchain.pem}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-/etc/nginx/certs/privkey.pem}
      NGINX_REDIRECT_HTTPS: ${NGINX_REDIRECT_HTTPS:-true}
    depends_on:
      nexus:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/certs:/etc/nginx/certs:ro
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must be set}/acme:/var/www/acme
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 300s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
