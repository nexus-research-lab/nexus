name: macOS Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/macos/**"
      - "scripts/desktop/**"
      - "web/**"
      - "docs/guides/room-skill-authoring*.md"
      - "db/migrations/**"
      - "skills/**"
      - "cmd/nexus-server/**"
      - "cmd/nexusctl/**"
      - "cmd/nexuscfg/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-desktop-build.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  push:
    branches:
      - main
    paths:
      - "desktop/macos/**"
      - "scripts/desktop/**"
      - "web/**"
      - "docs/guides/room-skill-authoring*.md"
      - "db/migrations/**"
      - "skills/**"
      - "cmd/nexus-server/**"
      - "cmd/nexusctl/**"
      - "cmd/nexuscfg/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-desktop-build.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"

permissions:
  contents: read

concurrency:
  group: macos-desktop-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_web:
    name: Build desktop web assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and build web/dist
        env:
          NEXUS_DESKTOP_BUILD: "1"
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run build

      - name: Upload desktop web assets
        uses: actions/upload-artifact@v7
        with:
          name: macos-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  sandbox_baseline:
    name: Validate macOS desktop sandbox with real nxs
    # Fork PRs cannot read the nxs release token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch paired nxs runtime
        env:
          NEXUS_DESKTOP_NXS_RELEASE: "nxs-v0.3.0"
          NEXUS_DESKTOP_NXS_DOWNLOAD_TOKEN: ${{ secrets.NEXUS_NXS_RUNTIME_RELEASE_TOKEN }}
        run: |
          node scripts/desktop/fetch-nxs-runtime.js \
            --goos darwin \
            --goarch arm64 \
            --output "${RUNNER_TEMP}/nxs/nxs" \
            --ripgrep-output "${RUNNER_TEMP}/nxs/rg"

      # Real Seatbelt boundaries, capability handshake and MCP round trips.
      # Scripted model fixtures only: no provider credentials or model calls.
      - name: Run desktop sandbox baseline
        run: |
          NEXUS_SANDBOX_TEST_BINARY="${RUNNER_TEMP}/nxs/nxs" make check-desktop-sandbox

  build:
    name: Validate macOS ${{ matrix.display_name }} build, smoke, and package
    needs: [build_web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Apple Silicon
            runner: macos-15
            target_arch: arm64
          - display_name: Intel
            runner: macos-15-intel
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      NEXUS_DESKTOP_GITHUB_CLIENT_ID: ${{ vars.NEXUS_DESKTOP_GITHUB_CLIENT_ID }}
      NEXUS_DESKTOP_TARGET_ARCH: ${{ matrix.target_arch }}
      NEXUS_DESKTOP_APP_BUILD_DIR: ${{ runner.temp }}/macos-app
      NEXUS_DESKTOP_SKIP_WEB_BUILD: "1"
      NEXUS_DESKTOP_SMOKE_ALLOW_FALLBACK: "1"
      NEXUS_DESKTOP_SMOKE_MAIN_TIMEOUT_SECONDS: "45"
      NEXUS_DESKTOP_SMOKE_LAUNCHER_TIMEOUT_SECONDS: "30"
      NEXUS_DESKTOP_SMOKE_EXPECTED_CREDENTIALS_STORAGE: "file"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download desktop web assets
        uses: actions/download-artifact@v7
        with:
          name: macos-web-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: desktop/macos/.build
          key: ${{ runner.os }}-${{ matrix.target_arch }}-swiftpm-${{ hashFiles('desktop/macos/Package.swift', 'desktop/macos/Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target_arch }}-swiftpm-

      - name: Build and smoke test macOS app
        run: |
          scripts/desktop/smoke-macos-app.sh

      - name: Package macOS DMG without release signing
        env:
          NEXUS_DESKTOP_BUNDLE_NXS_RUNTIME: "0"
          NEXUS_DESKTOP_PACKAGE_FORMAT: dmg
          NEXUS_DESKTOP_PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/macos-package-check
          NEXUS_DESKTOP_PACKAGE_SKIP_BUILD: "1"
          NEXUS_DESKTOP_PACKAGE_SKIP_SMOKE: "1"
          # CI 仅校验打包链路、校验和与元数据，使用快速 zlib 压缩避免 Intel 机器长时间单核压缩。
          NEXUS_DESKTOP_DMG_ZLIB_LEVEL: "1"
        run: |
          scripts/desktop/package-macos-app.sh
          (
            cd "${RUNNER_TEMP}/macos-package-check"
            shasum -a 256 -c Nexus-macos-*.dmg.sha256
          )
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const outputDir = path.join(process.env.RUNNER_TEMP, "macos-package-check");
          const metadataPath = fs.readdirSync(outputDir)
            .find((name) => /^Nexus-macos-.*\.dmg\.metadata\.json$/.test(name));
          if (!metadataPath) {
            throw new Error(`missing macOS package metadata in ${outputDir}`);
          }

          const metadata = JSON.parse(fs.readFileSync(path.join(outputDir, metadataPath), "utf8"));
          const expectedArchitecture = process.env.NEXUS_DESKTOP_TARGET_ARCH;
          if (metadata.architecture !== expectedArchitecture) {
            throw new Error(`expected ${expectedArchitecture} metadata, got ${metadata.architecture ?? "unknown"}`);
          }
          if (metadata.signing?.kind !== "ad-hoc") {
            throw new Error(`expected ad-hoc CI package, got ${metadata.signing?.kind ?? "unknown"}`);
          }
          if (metadata.signing?.developer_id || metadata.signing?.notarized) {
            throw new Error("CI package validation must not produce Developer ID notarized metadata");
          }
          NODE
