name: Backend checks

on:
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "db/migrations/**"
      - "scripts/check-architecture/**"
      - "scripts/check-go-changed.sh"
      - "scripts/check-go-scope/**"
      - "tools/protocol-tsgen/**"
      - "web/src/types/generated/protocol.ts"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/backend-check.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "db/migrations/**"
      - "scripts/check-architecture/**"
      - "scripts/check-go-changed.sh"
      - "scripts/check-go-scope/**"
      - "tools/protocol-tsgen/**"
      - "web/src/types/generated/protocol.ts"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/backend-check.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  static:
    name: Backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check internal production dependency boundaries
        run: go run ./scripts/check-architecture
      - name: Check generated frontend protocol
        run: |
          go generate ./internal/protocol
          git diff --exit-code -- web/src/types/generated/protocol.ts
      - name: Static analysis
        run: go vet -p=4 ./...

  tests-storage:
    name: Backend tests (storage + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_URL: postgres://nexus:nexus-test@127.0.0.1:5432/nexus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage packages
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -E '/internal/storage($|/)' | grep -v '/internal/storage/orchestration$')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  tests-service:
    name: Backend tests (service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test service packages
        shell: bash
        run: |
          set -euo pipefail
          # internal/service/configuration 包含 50+ 独立串行 SQLite 用例，预编译后 4 路分片跑满 4 核。
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          go test -vet=off -c -o "$tmpdir/cfg.test" ./internal/service/configuration
          mapfile -t cfg_tests < <("$tmpdir/cfg.test" -test.list '^Test' | grep '^Test')
          (( ${#cfg_tests[@]} > 0 ))
          pids=()
          for b in 0 1 2 3; do
            bucket=()
            for ((i=b; i<${#cfg_tests[@]}; i+=4)); do bucket+=("${cfg_tests[$i]}"); done
            (( ${#bucket[@]} == 0 )) && continue
            pattern="^($(IFS="|"; echo "${bucket[*]}"))$"
            (cd internal/service/configuration && "$tmpdir/cfg.test" -test.run "$pattern") >"$tmpdir/cfg_$b.log" 2>&1 &
            pids+=($!)
          done
          rc=0
          for ((b=0; b<${#pids[@]}; b++)); do
            if ! wait "${pids[$b]}"; then rc=1; echo "::group::configuration shard $b FAILED"; cat "$tmpdir/cfg_$b.log"; echo "::endgroup::"; fi
          done
          (( rc == 0 ))
          mapfile -t pkgs < <(go list ./... | grep -E '/internal/service($|/)' | grep -v '/internal/service/configuration$')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  tests-core:
    name: Backend tests (core + orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test orchestration and remaining packages
        shell: bash
        run: |
          set -euo pipefail
          # internal/storage/orchestration 包含 58 个独立串行 SQLite 用例，预编译后 4 路分片跑满 4 核。
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          go test -vet=off -c -o "$tmpdir/orch.test" ./internal/storage/orchestration
          mapfile -t orch_tests < <("$tmpdir/orch.test" -test.list '^Test' | grep '^Test')
          (( ${#orch_tests[@]} > 0 ))
          pids=()
          for b in 0 1 2 3; do
            bucket=()
            for ((i=b; i<${#orch_tests[@]}; i+=4)); do bucket+=("${orch_tests[$i]}"); done
            (( ${#bucket[@]} == 0 )) && continue
            pattern="^($(IFS="|"; echo "${bucket[*]}"))$"
            (cd internal/storage/orchestration && "$tmpdir/orch.test" -test.run "$pattern") >"$tmpdir/orch_$b.log" 2>&1 &
            pids+=($!)
          done
          rc=0
          for ((b=0; b<${#pids[@]}; b++)); do
            if ! wait "${pids[$b]}"; then rc=1; echo "::group::orchestration shard $b FAILED"; cat "$tmpdir/orch_$b.log"; echo "::endgroup::"; fi
          done
          (( rc == 0 ))
          mapfile -t pkgs < <(go list ./... | grep -vE '/internal/(storage|service)($|/)')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  desktop-contracts:
    name: Native Go contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test desktop contracts
        run: go test -count=1 ./internal/infra/confinedfs ./internal/infra/desktopinstance ./internal/runtime ./internal/runtime/clientopts ./internal/handler/auth
