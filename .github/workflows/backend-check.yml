name: Backend checks

on:
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "db/migrations/**"
      - "scripts/check-architecture/**"
      - "scripts/check-go-changed.sh"
      - "scripts/check-go-scope/**"
      - "tools/protocol-tsgen/**"
      - "web/src/types/generated/protocol.ts"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/backend-check.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "db/migrations/**"
      - "scripts/check-architecture/**"
      - "scripts/check-go-changed.sh"
      - "scripts/check-go-scope/**"
      - "tools/protocol-tsgen/**"
      - "web/src/types/generated/protocol.ts"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/backend-check.yml"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  static:
    name: Backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check internal production dependency boundaries
        run: go run ./scripts/check-architecture
      - name: Check generated frontend protocol
        run: |
          go generate ./internal/protocol
          git diff --exit-code -- web/src/types/generated/protocol.ts
      - name: Static analysis
        run: go vet -p=4 ./...

  tests-storage:
    name: Backend tests (storage + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_URL: postgres://nexus:nexus-test@127.0.0.1:5432/nexus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage packages
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -E '/internal/storage($|/)' | grep -v '/internal/storage/orchestration$')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  tests-heavy:
    name: Backend tests (orchestration + config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test heavy SQLite packages (4-way sharded)
        shell: bash
        run: |
          set -euo pipefail
          run_sharded() {
            local pkg="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"
            go test -vet=off -c -o "$tmpdir/pkg.test" "./$pkg"
            mapfile -t tests < <("$tmpdir/pkg.test" -test.list '^Test' | grep '^Test')
            (( ${#tests[@]} > 0 ))
            local pids=()
            for b in 0 1 2 3; do
              local bucket=()
              for ((i=b; i<${#tests[@]}; i+=4)); do bucket+=("${tests[$i]}"); done
              (( ${#bucket[@]} == 0 )) && continue
              local pattern="^($(IFS="|"; echo "${bucket[*]}"))$"
              (cd "$pkg" && "$tmpdir/pkg.test" -test.run "$pattern") >"$tmpdir/b$b.log" 2>&1 &
              pids+=($!)
            done
            local rc=0
            for ((b=0; b<${#pids[@]}; b++)); do
              if ! wait "${pids[$b]}"; then
                rc=1
                echo "::group::${pkg} shard $b FAILED"
                cat "$tmpdir/b$b.log"
                echo "::endgroup::"
              fi
            done
            rm -rf "$tmpdir"
            return "$rc"
          }
          run_sharded internal/storage/orchestration
          run_sharded internal/service/configuration

  tests-service:
    name: Backend tests (service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test service packages
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -E '/internal/service($|/)' | grep -v '/internal/service/configuration$')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  tests-core:
    name: Backend tests (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test remaining packages
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -vE '/internal/(storage|service)($|/)')
          go test -vet=off -p=4 -count=1 "${pkgs[@]}"

  desktop-contracts:
    name: Native Go contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test desktop contracts
        run: go test -count=1 ./internal/infra/confinedfs ./internal/infra/desktopinstance ./internal/runtime ./internal/runtime/clientopts ./internal/handler/auth
