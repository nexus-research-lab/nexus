name: Publish Release Retry

# 发版打包的失败大多是 Apple 公证/staple、GitHub 下载等外部抖动；
# 首轮失败时自动重跑失败的 job 一次，避免人工 gh run rerun。
# 同一 run 内无法重跑自身（run 未结束），所以由 workflow_run 在 run 结束后触发。

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed

permissions:
  actions: write

jobs:
  rerun_failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun Failed Jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Publish Release run ${RUN_ID} failed on its first attempt; rerunning failed jobs once."
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
