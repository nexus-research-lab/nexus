name: Frontend checks

on:
  pull_request:
    paths:
      - "web/**"
      - "desktop/windows/Nexus.Desktop/Theme/**"
      - "design.md"
      - "docs/specs/**"
      - "makefile"
      - ".github/workflows/frontend-check.yml"
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "desktop/windows/Nexus.Desktop/Theme/**"
      - "design.md"
      - "docs/specs/**"
      - "makefile"
      - ".github/workflows/frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.2 --activate
          pnpm install --frozen-lockfile
      - name: Full lint, types, contracts, behavior tests and production build
        env:
          # ubuntu-latest 提供 4 核；本地默认仍为 1，避免开发机并发过高。
          VITEST_MAX_WORKERS: "4"
        run: pnpm run check:full

  frontend:
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require code checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
