name: Windows Desktop Build

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - "internal/infra/confinedfs/**"
      - "internal/runtime/**"
      - "internal/protocol/runtime_sandbox.go"
      - "go.mod"
      - "go.sum"
      - "scripts/desktop/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "desktop/windows/**"
      - "internal/infra/confinedfs/**"
      - "internal/runtime/**"
      - "internal/protocol/runtime_sandbox.go"
      - "go.mod"
      - "go.sum"
      - "scripts/desktop/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Validate Windows desktop build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate sandbox SDK credential
        shell: pwsh
        env:
          SDK_READ_TOKEN: ${{ secrets.NEXUS_SANDBOX_SDK_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_READ_TOKEN)) {
            throw "Configure NEXUS_SANDBOX_SDK_READ_TOKEN with read access to nexus-agent-sdk-go. Private SDK validation cannot run without this credential."
          }

      - name: Checkout pinned sandbox SDK
        uses: actions/checkout@v6
        with:
          repository: nexus-research-lab/nexus-agent-sdk-go
          token: ${{ secrets.NEXUS_SANDBOX_SDK_READ_TOKEN }}
          ref: 38221838946f17f87be9da4af5f10ddc95671edf
          path: .nexus-sandbox-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Windows sandbox contracts and native components
        id: sandbox
        shell: pwsh
        run: node scripts/desktop/check-windows-sandbox.mjs --native
        env:
          NEXUS_SANDBOX_SDK_SOURCE: ${{ github.workspace }}/.nexus-sandbox-sdk
          NEXUS_SANDBOX_REPORT_DIRECTORY: ${{ runner.temp }}/windows-sandbox-evidence

      - name: Upload Windows sandbox evidence
        if: ${{ !cancelled() && steps.sandbox.outcome != 'skipped' && steps.sandbox.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-sandbox-native-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/windows-sandbox-evidence/nexus-windows-sandbox-*

      - name: Build Windows desktop shell
        shell: pwsh
        run: |
          dotnet build desktop/windows/Nexus.Desktop/Nexus.Desktop.csproj `
            -c Release
