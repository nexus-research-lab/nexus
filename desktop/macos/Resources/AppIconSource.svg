  <path d="M293 12H732C911 12 1012 113 1012 292V733C1012 913 911 1012 731 1012H292C112 1012 12 912 12 731V293C12 113 113 12 293 12Z" fill="url(#rim)" stroke="#fbfaff" stroke-width="2"/>
