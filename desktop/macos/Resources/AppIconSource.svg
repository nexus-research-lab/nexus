<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nexus App Icon</title>
  <desc id="desc">紫蓝色 Nexus 穿山甲，置于带有蓝紫高光的圆角玻璃底板上。</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#00d9ff"/><stop offset=".32" stop-color="#6788ff"/><stop offset=".68" stop-color="#fafaff"/><stop offset="1" stop-color="#cc54ff"/>
    </linearGradient>
    <linearGradient id="panel" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#fafbff"/><stop offset=".5" stop-color="#f6f5fc"/><stop offset="1" stop-color="#dddffe"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#7fe4ff" stop-opacity=".42"/><stop offset="1" stop-color="#a6eaff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#e5b7fa" stop-opacity=".55"/><stop offset="1" stop-color="#e5b7fa" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1=".6" y1="0" x2=".3" y2="1"><stop stop-color="#7765fb"/><stop offset=".38" stop-color="#6559f3"/><stop offset=".7" stop-color="#494ded"/><stop offset="1" stop-color="#343ee7"/></linearGradient>
    <radialGradient id="face" cx=".6" cy=".36" r=".8"><stop stop-color="#ffffff"/><stop offset=".66" stop-color="#fefeff"/><stop offset="1" stop-color="#e9edf8"/></radialGradient>
    <radialGradient id="armor" cx=".2" cy=".03" r="1.08">
      <stop stop-color="#c0b4ff"/><stop offset=".25" stop-color="#a195f8"/><stop offset=".5" stop-color="#7b75e8"/><stop offset=".77" stop-color="#6163df"/><stop offset="1" stop-color="#4244c0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9e0ff"/><stop offset=".4" stop-color="#c1b8ff"/><stop offset="1" stop-color="#5052d8"/></linearGradient>
    <radialGradient id="navy" cx=".35" cy=".22" r=".8"><stop stop-color="#657eb7"/><stop offset=".34" stop-color="#153775"/><stop offset="1" stop-color="#00133f"/></radialGradient>
    <linearGradient id="badge" x1=".15" y1="0" x2=".7" y2="1"><stop stop-color="#8079ff"/><stop offset=".48" stop-color="#5055fa"/><stop offset="1" stop-color="#263ee1"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#8e83ff"/><stop offset=".24" stop-color="#6b5afb"/><stop offset=".7" stop-color="#564aee"/><stop offset="1" stop-color="#373bd4"/>
    </linearGradient>
    <linearGradient id="armBlend"><stop offset=".32" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="armMask" maskUnits="userSpaceOnUse" x="280" y="460" width="176" height="136"><rect x="280" y="460" width="176" height="136" fill="url(#armBlend)"/></mask>
    <linearGradient id="armHighlight"><stop stop-color="#ded8ff" stop-opacity=".85"/><stop offset=".6" stop-color="#b5abff" stop-opacity=".55"/><stop offset="1" stop-color="#9284ff" stop-opacity="0"/></linearGradient>
    <filter id="softEdge" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="armShadow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="softAlpha"/>
      <feOffset in="softAlpha" dx="1" dy="4" result="lowerAlpha"/>
      <feComposite in="SourceAlpha" in2="lowerAlpha" operator="out" result="lightEdge"/>
      <feFlood flood-color="#e6e0ff" flood-opacity=".5"/>
      <feComposite in2="lightEdge" operator="in" result="light"/>
      <feOffset in="softAlpha" dx="-2" dy="-5" result="upperAlpha"/>
      <feComposite in="SourceAlpha" in2="upperAlpha" operator="out" result="darkEdge"/>
      <feFlood flood-color="#171d87" flood-opacity=".65"/>
      <feComposite in2="darkEdge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="plateBevel" x="-.1" y="-.1" width="1.2" height="1.2" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
      <feOffset in="a" dx="2" dy="6" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="out" result="rim"/>
      <feFlood flood-color="#f2eaff" flood-opacity=".92"/><feComposite in2="rim" operator="in" result="light"/>
      <feOffset in="a" dx="-2" dy="-6" result="c"/>
      <feComposite in="SourceAlpha" in2="c" operator="out" result="bottom"/>
      <feFlood flood-color="#21259d" flood-opacity=".85"/><feComposite in2="bottom" operator="in" result="dark"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="rimBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="badgeLetter" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#192ac4" flood-opacity=".65"/></filter>
    <linearGradient id="crease"><stop stop-color="#1e28b0"/><stop offset="1" stop-color="#454bc7"/></linearGradient>
    <linearGradient id="chin" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#b8c4e4" stop-opacity="0"/><stop offset="1" stop-color="#b4bed8" stop-opacity=".4"/></linearGradient>
    <radialGradient id="shoulderLight" gradientUnits="userSpaceOnUse" cx="682" cy="312" r="146" gradientTransform="translate(0 -80) scale(1 1.25)"><stop stop-color="#a599ff" stop-opacity=".32"/><stop offset="1" stop-color="#9b8fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="backShade" gradientUnits="userSpaceOnUse" cx="835" cy="485" r="235"><stop stop-color="#1e22bb" stop-opacity=".62"/><stop offset="1" stop-color="#2e2ac7" stop-opacity="0"/></radialGradient>
    <radialGradient id="earFace" cx=".37" cy=".2" r=".85"><stop stop-color="#8d7aff"/><stop offset=".58" stop-color="#6654f1"/><stop offset="1" stop-color="#3b3bd5"/></radialGradient>
    <radialGradient id="backArmor" cx=".14" cy=".24" r="1.03"><stop stop-color="#c3b3ff"/><stop offset=".42" stop-color="#a192f3"/><stop offset=".7" stop-color="#8a7eee"/><stop offset="1" stop-color="#5554d7"/></radialGradient>
    <linearGradient id="earHighlight"><stop stop-color="#b4a9ff" stop-opacity="0"/><stop offset=".3" stop-color="#b4a9ff" stop-opacity=".55"/><stop offset=".65" stop-color="#b4a9ff" stop-opacity=".4"/><stop offset="1" stop-color="#b4a9ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="wristHighlight" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#b8b0ed" stop-opacity="0"/><stop offset=".25" stop-color="#b8b0ed" stop-opacity=".4"/><stop offset="1" stop-color="#b8b0ed" stop-opacity="0"/></linearGradient>
    <filter id="fineSoft"><feGaussianBlur stdDeviation=".6"/></filter>
    <linearGradient id="shoulderRim" gradientUnits="userSpaceOnUse" x1="600" y1="210" x2="792" y2="450"><stop stop-color="#b9adff" stop-opacity=".65"/><stop offset=".6" stop-color="#aca5ff" stop-opacity=".65"/><stop offset="1" stop-color="#8c87ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="bellyLight" gradientUnits="userSpaceOnUse" cx="318" cy="700" r="77" gradientTransform="translate(0 -280) scale(1 1.4)"><stop stop-color="#7174ff" stop-opacity=".8"/><stop offset=".45" stop-color="#565dff" stop-opacity=".45"/><stop offset="1" stop-color="#4b50f7" stop-opacity="0"/></radialGradient>
    <mask id="bodyBevelMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="white"/><ellipse cx="573" cy="198" rx="67" ry="24" fill="black" filter="url(#armShadow)"/></mask>
    <radialGradient id="earRootShade" gradientUnits="userSpaceOnUse" cx="589" cy="207" r="42"><stop stop-color="#2424a9" stop-opacity=".45"/><stop offset="1" stop-color="#3930c1" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2520a2" flood-opacity=".45"/></filter>
    <clipPath id="panelClip"><path d="M294 34H731C891 34 990 124 990 291V731C990 900 901 991 729 991H295C124 991 34 900 34 730V295C34 125 123 34 294 34Z"/></clipPath>
  </defs>
