<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexus WebBridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark">N</div>
        <div>
          <h1>Nexus WebBridge</h1>
          <p id="status" data-state="idle">正在检查连接…</p>
        </div>
      </header>

      <p class="hint">保持 Nexus Desktop 运行，扩展会自动完成连接。</p>

      <div class="primary-actions">
        <button id="connect" class="primary">连接 Nexus</button>
        <button id="disconnect">断开</button>
      </div>
      <details>
        <summary>高级设置</summary>
        <div class="advanced-settings">
          <label for="url">WebSocket 地址</label>
          <input id="url" type="url" spellcheck="false" autocomplete="off">
          <p class="hint">留空时自动连接本机 Nexus Desktop。</p>
          <div class="secondary-actions">
            <button id="test">测试地址</button>
            <button id="reset">恢复默认</button>
          </div>
        </div>
      </details>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
