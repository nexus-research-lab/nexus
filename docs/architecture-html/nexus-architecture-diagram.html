<!DOCTYPE html>
<!-- Adapted from diagram-design by Cathryn Lavery, MIT; source commit a157f7616473d966d6f433cf0b4d4f1880603504. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus 总体技术架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f9f9f7;
      --paper-2: #f3f3f0;
      --ink: #131313;
      --muted: #5f5e5a;
      --soft: #6d6b67;
      --rule-solid: #e5e5e2;
      --accent: #5b72ff;
      --link: #2d5da8;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px 32px;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: calc(100vw - 64px);
      max-width: 1280px;
      min-width: 0;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 800px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .subtitle {
      max-width: 760px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .diagram-shell {
      width: 100%;
      max-width: 100%;
      margin-top: 32px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }

    .colophon {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule-solid);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      body { padding: 32px 20px 24px; }
      .frame { width: calc(100vw - 40px); }
      h1 { font-size: 24px; line-height: 1.2; }
      .subtitle { font-size: 12px; }
      .colophon { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">Nexus · System Architecture</p>
      <h1>产品控制面与 Agent Runtime 的进程边界</h1>
      <p class="subtitle">Product 持有身份、协作与调度，Runtime 持有模型调用、工具循环、会话压缩与文件记忆。Bridge 以公开协议隔离两侧实现，默认 nxs 以闭源可执行程序分发。</p>
    </header>

    <div class="diagram-shell">
      <svg viewBox="0 0 1200 592" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="diagram-title diagram-description">
        <title id="diagram-title">Nexus 总体技术架构</title>
        <desc id="diagram-description">用户从 Web、桌面端或外部通道进入 Nexus Product。Product 持有业务数据库并通过 Agent SDK Bridge 控制独立 Runtime 子进程。默认 nxs Runtime 是闭源发行物，访问模型 Provider、Agent 工作区和会话记录，流式消息再经 Bridge 返回 Product。</desc>

        <defs>

            <polygon points="0 0, 8 3, 0 6" fill="#5b72ff"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2d5da8"/>
          </marker>
        </defs>

        <rect width="1200" height="592" fill="#f9f9f7"/>

        <rect x="244" y="108" width="104" height="16" rx="4" fill="#f9f9f7"/>
        <text x="296" y="120" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PRODUCT PLANE</text>

        <rect x="680" y="104" width="320" height="376" rx="8" fill="rgba(19,19,19,0.02)" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>

        <text x="752" y="120" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RUNTIME PLANE</text>

        <text x="344" y="268" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Nexus Product</text>
        <text x="344" y="288" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GO · REACT · WEBSOCKET</text>

</body>
</html>
