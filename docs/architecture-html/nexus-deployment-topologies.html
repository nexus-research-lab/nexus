<!DOCTYPE html>
<!-- Adapted from diagram-design by Cathryn Lavery, MIT; source commit a157f7616473d966d6f433cf0b4d4f1880603504. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus 运行形态</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f9f9f7;
      --paper-2: #f3f3f0;
      --ink: #131313;
      --muted: #5f5e5a;
      --soft: #6d6b67;
      --rule-solid: #e5e5e2;
      --accent: #5b72ff;
      --link: #2d5da8;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px 32px;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: calc(100vw - 64px);
      max-width: 1280px;
      min-width: 0;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 880px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .subtitle {
      max-width: 800px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .diagram-shell {
      width: 100%;
      max-width: 100%;
      margin-top: 32px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }

    .colophon {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule-solid);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      body { padding: 32px 20px 24px; }
      .frame { width: calc(100vw - 40px); }
      h1 { font-size: 24px; line-height: 1.2; }
      .colophon { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="frame">

      <h1>同一产品内核，三种宿主形态</h1>
