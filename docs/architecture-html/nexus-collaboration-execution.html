<!DOCTYPE html>
<!-- Adapted from diagram-design by Cathryn Lavery, MIT; source commit a157f7616473d966d6f433cf0b4d4f1880603504. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Room 与 Execution 分流</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f9f9f7;
      --paper-2: #f3f3f0;
      --ink: #131313;
      --muted: #5f5e5a;
      --soft: #6d6b67;
      --rule-solid: #e5e5e2;
      --accent: #5b72ff;
      --link: #2d5da8;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px 32px;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: calc(100vw - 64px);
      max-width: 1280px;
      min-width: 0;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 800px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .subtitle {
      max-width: 760px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .diagram-shell {
      width: 100%;
      max-width: 100%;
      margin-top: 32px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }

    .colophon {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule-solid);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      body { padding: 32px 20px 24px; }
      .frame { width: calc(100vw - 40px); }
      h1 { font-size: 24px; line-height: 1.2; }
      .subtitle { font-size: 12px; }
      .colophon { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">Nexus · Collaboration Flow</p>
      <h1>普通协作与受管执行如何分流</h1>
      <p class="subtitle">Room 始终保存 Conversation 因果关系；只有明确需要计划、分派和验收时，才进入受管 Execution。</p>
    </header>

    <div class="diagram-shell">
      <svg viewBox="0 0 1200 640" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="collaboration-title collaboration-description">
        <title id="collaboration-title">Nexus Room 与 Execution 分流</title>
        <desc id="collaboration-description">Room 收到消息或 Goal 后先保存 Conversation 因果关系。只有明确需要受管分工时才创建 Plan Revision、WorkGraph、Assignment、Attempt、Submission 和 Acceptance；普通聊天、Mention 与 Handoff 直接进入 Room 时间线。</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5f5e5a"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5b72ff"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2d5da8"/>
          </marker>
        </defs>

        <rect width="1200" height="640" fill="#f9f9f7"/>

        <!-- 连线先于节点绘制。 -->
        <line x1="440" y1="80" x2="440" y2="112" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="440" y1="184" x2="440" y2="216" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="440" y1="328" x2="440" y2="376" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="536" y1="272" x2="664" y2="272" stroke="#5b72ff" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="816" y1="308" x2="816" y2="352" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="816" y1="424" x2="816" y2="468" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="440" y1="448" x2="440" y2="520" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 664 504 H 600 Q 592 504 592 512 V 536 Q 592 544 584 544 H 560" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="448" y="340" width="40" height="12" rx="4" fill="#f9f9f7"/>
        <text x="468" y="348" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO</text>
        <rect x="572" y="252" width="48" height="12" rx="4" fill="#f9f9f7"/>
        <text x="596" y="260" fill="#5b72ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YES</text>
        <rect x="828" y="320" width="72" height="12" rx="4" fill="#f9f9f7"/>
        <text x="864" y="328" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DISPATCH</text>
        <rect x="828" y="436" width="72" height="12" rx="4" fill="#f9f9f7"/>
        <text x="864" y="444" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DELIVER</text>

        <!-- Start -->
        <rect x="320" y="32" width="240" height="48" rx="24" fill="rgba(95,94,90,0.10)" stroke="#6d6b67" stroke-width="1"/>
        <text x="440" y="60" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Room 收到消息或 Goal</text>

        <!-- Preserve causality -->
        <rect x="280" y="112" width="320" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
        <text x="440" y="144" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">记录 Conversation 因果关系</text>
        <text x="440" y="164" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MESSAGE · MENTION · HANDOFF</text>

        <!-- Decision -->
        <polygon points="440,216 536,272 440,328 344,272" fill="rgba(91,114,255,0.08)" stroke="#5b72ff" stroke-width="1.2"/>
        <text x="440" y="268" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">需要受管</text>
        <text x="440" y="288" fill="#5b72ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EXECUTION?</text>

        <!-- Direct path -->
        <rect x="312" y="376" width="256" height="72" rx="8" fill="rgba(95,94,90,0.10)" stroke="#6d6b67" stroke-width="1"/>
        <text x="440" y="408" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">直接聊天 / Mention / Handoff</text>
        <text x="440" y="428" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO MANAGED GRAPH</text>

        <!-- Managed path -->
        <rect x="664" y="236" width="304" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
        <text x="816" y="268" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">固定 Plan Revision + WorkGraph</text>
        <text x="816" y="288" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IMMUTABLE PLAN</text>

        <rect x="664" y="352" width="304" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
        <text x="816" y="384" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">创建 Assignment + Attempt</text>
        <text x="816" y="404" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AGENT · INPUT CONTRACT</text>

        <rect x="664" y="468" width="304" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
        <text x="816" y="500" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Submission + Acceptance</text>
        <text x="816" y="520" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AUDITABLE RESULT</text>

        <!-- End -->
        <rect x="320" y="520" width="240" height="48" rx="24" fill="rgba(19,19,19,0.05)" stroke="#5f5e5a" stroke-width="1"/>
        <text x="440" y="548" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">写入 Room 时间线</text>

        <line x1="32" y1="592" x2="1168" y2="592" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>
        <text x="600" y="620" fill="#5f5e5a" font-size="12" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">普通聊天不会因参与人数自动升级为 Execution。</text>
      </svg>
    </div>

    <footer class="colophon">
      <span>NEXUS ARCHITECTURE · 2026-08-11</span>
      <span>ROOM · GOAL · EXECUTION</span>
    </footer>
  </main>
</body>
</html>
