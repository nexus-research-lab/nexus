<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">Nexus 三种运行形态</title>
  <desc id="deployment-description">图中并列展示桌面 App、Docker 服务和源码服务。三种形态复用 React Web 与 Go 后端，差异在宿主入口、进程组织和数据库部署。</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5f5e5a"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b72ff"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d5da8"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f9f9f7"/>

  <!-- 三种部署边界。 -->
  <rect x="32" y="64" width="352" height="448" rx="8" fill="rgba(19,19,19,0.02)" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>
  <rect x="52" y="68" width="96" height="16" rx="4" fill="#f9f9f7"/>
  <text x="100" y="80" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DESKTOP APP</text>

  <rect x="424" y="64" width="352" height="448" rx="8" fill="rgba(19,19,19,0.02)" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>
  <rect x="444" y="68" width="104" height="16" rx="4" fill="#f9f9f7"/>
  <text x="496" y="80" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER SERVICE</text>

  <rect x="816" y="64" width="352" height="448" rx="8" fill="rgba(19,19,19,0.02)" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>
  <rect x="836" y="68" width="104" height="16" rx="4" fill="#f9f9f7"/>
  <text x="888" y="80" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SOURCE SERVICE</text>

  <!-- 连线先于节点绘制。 -->
  <line x1="208" y1="184" x2="208" y2="248" stroke="#2d5da8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="208" y1="320" x2="208" y2="384" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="184" x2="600" y2="248" stroke="#2d5da8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="600" y1="320" x2="600" y2="384" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
