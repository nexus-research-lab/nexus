  <text x="208" y="168" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">APPKIT · WPF</text>

  <rect x="80" y="248" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="80" y="248" width="256" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
  <rect x="92" y="260" width="40" height="16" rx="4" fill="transparent" stroke="rgba(19,19,19,0.40)" stroke-width="0.8"/>
