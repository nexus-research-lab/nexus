  <text x="208" y="288" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nexus-server Sidecar</text>
  <text x="208" y="304" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RANDOM PORT · SESSION TOKEN</text>

  <rect x="80" y="384" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="80" y="384" width="256" height="72" rx="8" fill="rgba(19,19,19,0.05)" stroke="#5f5e5a" stroke-width="1"/>
  <rect x="92" y="396" width="32" height="16" rx="4" fill="transparent" stroke="rgba(95,94,90,0.50)" stroke-width="0.8"/>
  <text x="108" y="408" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DB</text>
  <text x="208" y="424" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">本地状态</text>
  <text x="208" y="440" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLITE · ~/.NEXUS</text>

  <!-- Docker -->
  <rect x="472" y="112" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="472" y="112" width="256" height="72" rx="8" fill="rgba(19,19,19,0.03)" stroke="rgba(19,19,19,0.30)" stroke-width="1"/>
  <rect x="484" y="124" width="40" height="16" rx="4" fill="transparent" stroke="rgba(19,19,19,0.30)" stroke-width="0.8"/>
  <text x="504" y="136" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EDGE</text>
  <text x="600" y="152" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Nginx + Web 静态资源</text>
  <text x="600" y="168" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTP · WEBSOCKET PROXY</text>

  <rect x="472" y="248" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="472" y="248" width="256" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
  <rect x="484" y="260" width="40" height="16" rx="4" fill="transparent" stroke="rgba(19,19,19,0.40)" stroke-width="0.8"/>
  <text x="504" y="272" fill="#131313" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PROC</text>
  <text x="600" y="288" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nexus-server 服务</text>
  <text x="600" y="304" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:8010 · SINGLE WORKER</text>

  <rect x="472" y="384" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="472" y="384" width="256" height="72" rx="8" fill="rgba(19,19,19,0.05)" stroke="#5f5e5a" stroke-width="1"/>
  <rect x="484" y="396" width="32" height="16" rx="4" fill="transparent" stroke="rgba(95,94,90,0.50)" stroke-width="0.8"/>
  <text x="500" y="408" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DB</text>
  <text x="600" y="424" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">服务端数据库</text>
  <text x="600" y="440" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLITE · POSTGRESQL</text>

  <!-- Source -->
  <rect x="864" y="112" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="864" y="112" width="256" height="72" rx="8" fill="rgba(95,94,90,0.10)" stroke="#6d6b67" stroke-width="1"/>
  <rect x="876" y="124" width="40" height="16" rx="4" fill="transparent" stroke="rgba(109,107,103,0.40)" stroke-width="0.8"/>
  <text x="896" y="136" fill="#6d6b67" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">INPUT</text>
  <text x="992" y="152" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">浏览器 + React 开发入口</text>
  <text x="992" y="168" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VITE · WEB ASSETS</text>

  <rect x="864" y="248" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="864" y="248" width="256" height="72" rx="8" fill="#ffffff" stroke="#131313" stroke-width="1"/>
  <rect x="876" y="260" width="40" height="16" rx="4" fill="transparent" stroke="rgba(19,19,19,0.40)" stroke-width="0.8"/>
  <text x="896" y="272" fill="#131313" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PROC</text>
  <text x="992" y="288" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nexus-server 进程</text>
  <text x="992" y="304" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SOURCE BUILD</text>

  <rect x="864" y="384" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="864" y="384" width="256" height="72" rx="8" fill="rgba(19,19,19,0.05)" stroke="#5f5e5a" stroke-width="1"/>
  <rect x="876" y="396" width="32" height="16" rx="4" fill="transparent" stroke="rgba(95,94,90,0.50)" stroke-width="0.8"/>
  <text x="892" y="408" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DB</text>
  <text x="992" y="424" fill="#131313" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">开发数据库</text>
  <text x="992" y="440" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLITE · POSTGRESQL</text>

  <line x1="32" y1="544" x2="1168" y2="544" stroke="rgba(19,19,19,0.10)" stroke-width="0.8"/>
  <text x="600" y="572" fill="#5f5e5a" font-size="12" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">共享 React Web 与 Go 后端，差异只在宿主、入口和数据库部署。</text>
</svg>
