  <rect x="216" y="204" width="72" height="12" rx="4" fill="#f9f9f7"/>
  <text x="252" y="212" fill="#2d5da8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LOOPBACK</text>
  <rect x="216" y="340" width="32" height="12" rx="4" fill="#f9f9f7"/>
  <text x="232" y="348" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQL</text>

  <rect x="608" y="204" width="48" height="12" rx="4" fill="#f9f9f7"/>
  <text x="632" y="212" fill="#2d5da8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PROXY</text>
  <rect x="608" y="340" width="32" height="12" rx="4" fill="#f9f9f7"/>
  <text x="624" y="348" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQL</text>

  <rect x="1000" y="204" width="64" height="12" rx="4" fill="#f9f9f7"/>
  <text x="1032" y="212" fill="#2d5da8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTP · WS</text>
  <rect x="1000" y="340" width="32" height="12" rx="4" fill="#f9f9f7"/>
  <text x="1016" y="348" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQL</text>

  <!-- Desktop -->
  <rect x="80" y="112" width="256" height="72" rx="8" fill="#f9f9f7"/>
  <rect x="80" y="112" width="256" height="72" rx="8" fill="rgba(91,114,255,0.08)" stroke="#5b72ff" stroke-width="1.2"/>
  <rect x="92" y="124" width="40" height="16" rx="4" fill="transparent" stroke="rgba(91,114,255,0.50)" stroke-width="0.8"/>
